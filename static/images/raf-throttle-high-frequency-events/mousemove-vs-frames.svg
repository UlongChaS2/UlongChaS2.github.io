<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" viewBox="0 0 520 330">
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="520" height="330" rx="28" fill="#F8FAFC"/>
<rect x="18" y="18" width="484" height="294" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="34" y="52" font-size="22" font-weight="800" fill="#1F2937">rAF 스로틀</text>
<text x="34" y="76" font-size="13" font-weight="700" fill="#64748B">이벤트는 프레임보다 자주 옵니다 — 처리는 프레임당 마지막 값 하나면 충분합니다</text>

<!-- frame boundaries -->
<g stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 5">
  <line x1="60" y1="100" x2="60" y2="256"/>
  <line x1="190" y1="100" x2="190" y2="256"/>
  <line x1="320" y1="100" x2="320" y2="256"/>
  <line x1="450" y1="100" x2="450" y2="256"/>
</g>
<g font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">
  <text x="125" y="274">프레임 1 (~16.7ms)</text>
  <text x="255" y="274">프레임 2</text>
  <text x="385" y="274">프레임 3</text>
</g>

<!-- mousemove dots row -->
<text x="34" y="126" font-size="12" font-weight="800" fill="#475569">mousemove</text>
<g fill="#CBD5E1">
  <circle cx="76" cy="146" r="6"/><circle cx="100" cy="146" r="6"/><circle cx="122" cy="146" r="6"/><circle cx="147" cy="146" r="6"/>
  <circle cx="205" cy="146" r="6"/><circle cx="232" cy="146" r="6"/><circle cx="251" cy="146" r="6"/><circle cx="272" cy="146" r="6"/><circle cx="290" cy="146" r="6"/>
  <circle cx="338" cy="146" r="6"/><circle cx="371" cy="146" r="6"/>
</g>
<!-- last dot per frame = accent -->
<g fill="#3B82F6" stroke="#DBEAFE" stroke-width="4">
  <circle cx="172" cy="146" r="7"/>
  <circle cx="308" cy="146" r="7"/>
  <circle cx="424" cy="146" r="7"/>
</g>

<!-- arrows from last dots to rAF row -->
<g stroke="#3B82F6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M172 160 L172 196 M166 188 L172 196 L178 188"/>
  <path d="M308 160 L308 196 M302 188 L308 196 L314 188"/>
  <path d="M424 160 L424 196 M418 188 L424 196 L430 188"/>
</g>

<!-- rAF processing row -->
<text x="34" y="216" font-size="12" font-weight="800" fill="#475569">rAF 처리</text>
<g font-size="11.5" font-weight="800" text-anchor="middle">
  <rect x="134" y="202" width="76" height="28" rx="9" fill="#3B82F6"/>
  <text x="172" y="221" fill="#FFFFFF">handle()</text>
  <rect x="270" y="202" width="76" height="28" rx="9" fill="#3B82F6"/>
  <text x="308" y="221" fill="#FFFFFF">handle()</text>
  <rect x="386" y="202" width="76" height="28" rx="9" fill="#3B82F6"/>
  <text x="424" y="221" fill="#FFFFFF">handle()</text>
</g>

<text x="260" y="298" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748B">회색 이벤트는 pending에 덮어쓰기만 — 파란 마지막 좌표만 다음 프레임 직전에 처리됩니다</text>
</svg>
