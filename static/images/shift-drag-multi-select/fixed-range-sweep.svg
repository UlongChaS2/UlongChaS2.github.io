<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380">
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Menlo,Consolas,monospace}</style>
<rect width="520" height="380" rx="28" fill="#F8FAFC"/>
<rect x="18" y="18" width="484" height="344" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="34" y="52" font-size="22" font-weight="800" fill="#1F2937">수정 후 — 구간 스윕</text>
<text x="34" y="76" font-size="13" font-weight="700" fill="#64748B">시작 y ~ 현재 y 구간과 겹치는, 보이는 행 전부에 목표 상태를 적용합니다</text>

<!-- list with two open groups + one collapsed -->
<rect x="150" y="96" width="220" height="240" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<g font-size="11.5" font-weight="700">
  <rect x="162" y="108" width="196" height="22" rx="7" fill="#E2E8F0"/>
  <text x="172" y="123" fill="#475569">▾ 그룹 A</text>
  <rect x="162" y="136" width="196" height="22" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="184" y="151" fill="#64748B">항목 A-1</text>
  <rect x="162" y="164" width="196" height="22" rx="7" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="184" y="179" fill="#1D4ED8">✓ 항목 A-2</text>
  <rect x="162" y="192" width="196" height="22" rx="7" fill="#E2E8F0"/>
  <text x="172" y="207" fill="#475569">▾ 그룹 B</text>
  <rect x="162" y="220" width="196" height="22" rx="7" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="184" y="235" fill="#1D4ED8">✓ 항목 B-1</text>
  <rect x="162" y="248" width="196" height="22" rx="7" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="184" y="263" fill="#1D4ED8">✓ 항목 B-2</text>
  <rect x="162" y="276" width="196" height="22" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="184" y="291" fill="#64748B">항목 B-3</text>
  <rect x="162" y="304" width="196" height="22" rx="7" fill="#E2E8F0"/>
  <text x="172" y="319" fill="#475569">▸ 그룹 C (접힘 — 스윕 제외)</text>
</g>

<!-- sweep band from A-2 through B-2, crossing group header -->
<rect x="144" y="166" width="232" height="102" rx="8" fill="#3B82F6" opacity="0.12"/>
<g stroke="#3B82F6" stroke-width="2.5" fill="none" stroke-linecap="round">
  <line x1="144" y1="167" x2="376" y2="167"/>
  <line x1="144" y1="268" x2="376" y2="268"/>
</g>

<!-- y labels -->
<g class="mono" font-size="11.5" font-weight="800" fill="#1D4ED8" text-anchor="end">
  <text x="136" y="171">startY</text>
  <text x="136" y="272">currentY</text>
</g>

<!-- right annotations -->
<g font-size="12" font-weight="700" fill="#475569">
  <text x="388" y="180">구간과 겹치는</text>
  <text x="388" y="196">보이는 행만 ✓</text>
  <text x="388" y="240" fill="#10B981">그룹 경계를 넘는</text>
  <text x="388" y="256" fill="#10B981">드래그가 공짜</text>
  <text x="388" y="316" fill="#94A3B8">접힌 그룹은</text>
  <text x="388" y="332" fill="#94A3B8">가시성 판정에서 제외</text>
</g>

<text x="260" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#94A3B8">구간은 연속이라 이벤트가 누락돼도 항목이 빠질 수 없습니다 — 구간 채우기 보정이 사라진 이유</text>
</svg>
