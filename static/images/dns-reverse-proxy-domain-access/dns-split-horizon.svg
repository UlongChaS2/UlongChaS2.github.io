<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3182F6"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7684"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0EA678"/>
    </marker>
    <marker id="arrRed2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F04452"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="600" fill="#FFFFFF"/>

  <!-- 도메인 -->
  <rect x="330" y="24" width="280" height="44" rx="22" fill="#3182F6"/>
  <text x="470" y="52" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">app.example.co.kr</text>

  <!-- 분기 화살표 -->
  <path d="M395,70 C300,92 255,100 245,116" fill="none" stroke="#3182F6" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <path d="M545,70 C640,92 685,100 695,116" fill="none" stroke="#6B7684" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <!-- ═══════ 왼쪽: 내부망 ═══════ -->
  <rect x="30" y="122" width="430" height="390" rx="16" fill="#EFF5FE"/>
  <text x="52" y="154" font-size="15" font-weight="800" fill="#3182F6">회사 내부망에서</text>

  <rect x="165" y="172" width="160" height="56" rx="12" fill="#FFFFFF" stroke="#3182F6" stroke-width="1.5"/>
  <text x="245" y="196" font-size="13.5" font-weight="700" fill="#191F28" text-anchor="middle">내부망 PC</text>
  <text x="245" y="215" font-size="11" fill="#6B7684" text-anchor="middle">회사 내부 DNS 사용</text>

  <line x1="245" y1="228" x2="245" y2="270" stroke="#3182F6" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <text x="270" y="245" font-size="11.5" fill="#3182F6" font-weight="600">주소 조회</text>
  <text x="270" y="261" font-size="11" fill="#6B7684">app.example.co.kr</text>

  <rect x="165" y="270" width="160" height="52" rx="12" fill="#FFFFFF" stroke="#3182F6" stroke-width="1.5"/>
  <text x="245" y="292" font-size="13.5" font-weight="700" fill="#191F28" text-anchor="middle">회사 내부 DNS</text>
  <text x="245" y="311" font-size="11" fill="#6B7684" text-anchor="middle">내부 주소 레코드 보유</text>

  <line x1="245" y1="322" x2="245" y2="362" stroke="#0EA678" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="270" y="345" font-size="11.5" fill="#0EA678" font-weight="700">응답: 172.16.10.5</text>

  <rect x="145" y="364" width="200" height="60" rx="12" fill="#FFFFFF" stroke="#0EA678" stroke-width="2"/>
  <text x="245" y="389" font-size="13.5" font-weight="700" fill="#191F28" text-anchor="middle">DNS 조회 결과</text>
  <text x="245" y="409" font-size="12" fill="#0EA678" text-anchor="middle" font-weight="700">172.16.10.5 (사설 IP)</text>

  <text x="245" y="462" font-size="11.5" fill="#6B7684" text-anchor="middle">사설 IP를 알아도 서버에 접속하려면</text>
  <text x="245" y="480" font-size="11.5" fill="#6B7684" text-anchor="middle">사내망이나 VPN 경로가 필요하다</text>

  <!-- ═══════ 오른쪽: 외부 ═══════ -->
  <rect x="480" y="122" width="430" height="390" rx="16" fill="#F4F5F7"/>
  <text x="502" y="154" font-size="15" font-weight="800" fill="#6B7684">집·외부 인터넷에서</text>

  <rect x="615" y="172" width="160" height="56" rx="12" fill="#FFFFFF" stroke="#6B7684" stroke-width="1.5"/>
  <text x="695" y="196" font-size="13.5" font-weight="700" fill="#191F28" text-anchor="middle">외부 PC</text>
  <text x="695" y="215" font-size="11" fill="#6B7684" text-anchor="middle">외부 DNS 사용</text>

  <line x1="695" y1="228" x2="695" y2="270" stroke="#6B7684" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="720" y="245" font-size="11.5" fill="#6B7684" font-weight="600">주소 조회</text>
  <text x="720" y="261" font-size="11" fill="#6B7684">app.example.co.kr</text>

  <rect x="615" y="270" width="160" height="52" rx="12" fill="#FFFFFF" stroke="#6B7684" stroke-width="1.5"/>
  <text x="695" y="292" font-size="13.5" font-weight="700" fill="#191F28" text-anchor="middle">공인 DNS</text>
  <text x="695" y="311" font-size="11" fill="#6B7684" text-anchor="middle">이 예시에는 주소 레코드 없음</text>

  <line x1="695" y1="322" x2="695" y2="362" stroke="#F04452" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrRed2)"/>
  <text x="720" y="345" font-size="11.5" fill="#F04452" font-weight="700">주소 레코드 없음</text>

  <rect x="595" y="364" width="200" height="60" rx="12" fill="#FFFFFF" stroke="#F04452" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="695" y="389" font-size="13.5" font-weight="700" fill="#191F28" text-anchor="middle">DNS 조회 결과</text>
  <text x="695" y="409" font-size="12" fill="#F04452" text-anchor="middle" font-weight="700">IP 주소를 얻지 못함</text>

  <text x="695" y="462" font-size="11.5" fill="#6B7684" text-anchor="middle">외부 DNS에 다른 주소 레코드가 있다면</text>
  <text x="695" y="480" font-size="11.5" fill="#6B7684" text-anchor="middle">그 주소를 응답할 수도 있다</text>

  <!-- 결론 -->
  <text x="470" y="552" font-size="13.5" font-weight="700" fill="#191F28" text-anchor="middle">같은 도메인도 사용하는 DNS에 따라 조회 결과가 달라질 수 있다.</text>
  <text x="470" y="576" font-size="13" fill="#3182F6" text-anchor="middle" font-weight="700">내부와 외부에 다른 DNS 답을 제공하는 구성: 스플릿 호라이즌 DNS</text>
</svg>
