<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrDown" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,0 L5,10 z" fill="#6B7684"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="660" fill="#FFFFFF"/>

  <text x="40" y="40" font-size="19" font-weight="800" fill="#191F28">OSI 계층과 영역 경계</text>
  <text x="40" y="64" font-size="12.5" fill="#6B7684">아래층일수록 인프라 영역, 위층일수록 애플리케이션 영역. 필요한 배움의 결이 다르다.</text>

  <!-- 헤더 -->
  <text x="60" y="104" font-size="11.5" font-weight="700" fill="#8B95A1">계층</text>
  <text x="230" y="104" font-size="11.5" font-weight="700" fill="#8B95A1">이번 사례에서 해당하는 것</text>
  <text x="700" y="104" font-size="11.5" font-weight="700" fill="#8B95A1">영역</text>

  <!-- L7 -->
  <rect x="40" y="116" width="620" height="62" rx="10" fill="#EFF5FE"/>
  <rect x="668" y="116" width="232" height="62" rx="10" fill="#3182F6"/>
  <text x="60" y="143" font-size="13.5" font-weight="800" fill="#191F28">L7 응용</text>
  <text x="60" y="163" font-size="11" fill="#6B7684">Application</text>
  <text x="230" y="143" font-size="13" fill="#191F28">앱(HTTP 응답) · nginx 리버스 프록시 설정</text>
  <text x="230" y="163" font-size="13" fill="#191F28">DNS 프로토콜</text>
  <text x="784" y="152" font-size="13.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">애플리케이션</text>

  <!-- L4 -->
  <rect x="40" y="188" width="620" height="62" rx="10" fill="#F4F5F7"/>
  <rect x="668" y="188" width="232" height="62" rx="10" fill="#6B7684"/>
  <text x="60" y="215" font-size="13.5" font-weight="800" fill="#191F28">L4 전송</text>
  <text x="60" y="235" font-size="11" fill="#6B7684">Transport</text>
  <text x="230" y="215" font-size="13" fill="#191F28">TCP 포트 80 / 8080</text>
  <text x="230" y="235" font-size="13" fill="#191F28">방화벽 포트 개방 정책</text>
  <text x="784" y="224" font-size="13.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">인프라</text>

  <!-- L3 -->
  <rect x="40" y="260" width="620" height="62" rx="10" fill="#F4F5F7"/>
  <rect x="668" y="260" width="232" height="62" rx="10" fill="#6B7684"/>
  <text x="60" y="287" font-size="13.5" font-weight="800" fill="#191F28">L3 네트워크</text>
  <text x="60" y="307" font-size="11" fill="#6B7684">Network</text>
  <text x="230" y="287" font-size="13" fill="#191F28">IP 주소 172.16.10.5 · 라우팅</text>
  <text x="230" y="307" font-size="13" fill="#191F28">사설 IP 대역 할당</text>
  <text x="784" y="296" font-size="13.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">인프라</text>

  <!-- L2/L1 -->
  <rect x="40" y="332" width="620" height="52" rx="10" fill="#F4F5F7"/>
  <rect x="668" y="332" width="232" height="52" rx="10" fill="#6B7684"/>
  <text x="60" y="356" font-size="13.5" font-weight="800" fill="#191F28">L2 / L1</text>
  <text x="60" y="374" font-size="11" fill="#6B7684">Data Link / Physical</text>
  <text x="230" y="363" font-size="13" fill="#191F28">스위치 · 케이블 · 물리 회선</text>
  <text x="784" y="363" font-size="13.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">인프라</text>

  <!-- 방향 축 -->
  <line x1="22" y1="120" x2="22" y2="378" stroke="#6B7684" stroke-width="1.2" marker-end="url(#arrDown)"/>
  <text x="14" y="200" font-size="10.5" fill="#8B95A1" transform="rotate(-90 14 200)" text-anchor="middle">소프트웨어</text>
  <text x="14" y="320" font-size="10.5" fill="#8B95A1" transform="rotate(-90 14 320)" text-anchor="middle">물리</text>

  <!-- 예외 영역 -->
  <text x="40" y="428" font-size="15" font-weight="800" fill="#F04452">계층 번호만으로 영역을 정할 수 없는 예외 2가지</text>

  <rect x="40" y="444" width="425" height="128" rx="12" fill="#FDF3F4"/>
  <text x="62" y="472" font-size="13.5" font-weight="800" fill="#191F28">① DNS는 L7인데 인프라 영역</text>
  <text x="62" y="497" font-size="12" fill="#6B7684">기술적으로는 응용 계층 프로토콜이지만,</text>
  <text x="62" y="517" font-size="12" fill="#6B7684">DNS 서버라는 장비를 네트워크 인프라로 다룬다.</text>
  <text x="62" y="545" font-size="12" fill="#F04452" font-weight="700">→ 계층이 아니라 다루는 대상이 영역을 가른다</text>

  <rect x="480" y="444" width="420" height="128" rx="12" fill="#FDF3F4"/>
  <text x="502" y="472" font-size="13.5" font-weight="800" fill="#191F28">② 포트는 L4인데 양쪽이 관여</text>
  <text x="502" y="497" font-size="12" fill="#6B7684">방화벽에서 80을 여는 것 = 인프라</text>
  <text x="502" y="517" font-size="12" fill="#6B7684">80에서 실제로 듣는 프로그램 = 애플리케이션</text>
  <text x="502" y="545" font-size="12" fill="#F04452" font-weight="700">→ 열려는 있는데 듣는 사람이 없던 상황</text>

  <!-- 결론 -->
  <rect x="40" y="592" width="860" height="46" rx="12" fill="#EFF5FE"/>
  <text x="470" y="612" font-size="13.5" font-weight="800" fill="#191F28" text-anchor="middle">실무 판별 기준은 계층 번호가 아니라 "서버 바깥이냐, 서버 안이냐"</text>
  <text x="470" y="630" font-size="12" fill="#6B7684" text-anchor="middle">바깥(DNS 레코드·방화벽·네트워크) = 인프라 · 안(nginx·앱·배포) = 애플리케이션</text>
</svg>
